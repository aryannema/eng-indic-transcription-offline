<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="V">
  <title>V</title>
  <!--
    Original mark. A V drawn as a descending pair of strokes, with the audio
    meter bars nested inside the negative space — the letter and the waveform
    are the same shape, which is the whole idea of a transcription tool.

    Geometry is on a 64-unit grid so it stays crisp at 16, 32 and 64 px.
  -->
  <defs>
    <linearGradient id="vg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#66FCF1"/>
      <stop offset="100%" stop-color="#45A29E"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="#0B0C10"/>

  <!-- the V: two strokes meeting at the baseline -->
  <path d="M16 17 L32 47 L48 17"
        fill="none" stroke="url(#vg)" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- meter bars in the negative space, shortest at the centre where the V narrows -->
  <g fill="#45FC91" opacity="0.9">
    <rect x="25.5" y="22" width="2.4" height="9"  rx="1.2"/>
    <rect x="30.8" y="25" width="2.4" height="5"  rx="1.2"/>
    <rect x="36.1" y="21" width="2.4" height="11" rx="1.2"/>
  </g>
</svg>
